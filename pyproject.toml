[project]
name = "phrasify"
version = "0.1.0"
description = "Extract reusable business English expression cards from transcripts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Phrasify contributors" }]
dependencies = []
keywords = ["english-learning", "transcripts", "llm", "japanese", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.34"]
notion = ["httpx>=0.27"]
nlp = ["spacy>=3.7"]
difficulty = ["textstat>=0.7.13", "wordfreq>=3.1.1", "cefrpy>=1.0.1"]
media = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "openai>=1.0",
  "python-dateutil>=2.9",
  "requests>=2.31",
  "youtube-transcript-api>=1.0",
  "yt-dlp>=2024.12.13",
]
dev = ["pytest>=8"]

[project.scripts]
phrasify = "phrasify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phrasify = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
